# The container's Nginx. Serves static assets and passes PHP to php-fpm.
server {
    listen 80;
    server_name _;

    root /app/public;

    client_max_body_size 16M;

    # Every request goes through the Symfony front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /app/public;

        # TLS is terminated by the host's Nginx, which always forwards HTTPS.
        # Without this, Symfony generates http:// links in e-mails.
        # This is the documented approach for hidden SSL termination.
        fastcgi_param HTTPS on;

        internal;
    }

    # Block any other executable .php.
    location ~ \.php$ {
        return 404;
    }

    # The customisation files have no hash in their names, so a short cache:
    # otherwise a branding change stays invisible for days.
    location ~ ^/(custom\.css|custom\.js)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Assets generated by esbuild carry a hash in their name, so cache long.
    location ~* \.(css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php$is_args$args;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
